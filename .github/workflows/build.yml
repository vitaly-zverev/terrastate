name: Build VSIX

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # webpack 5.44 (pinned in this project) is incompatible with the
      # OpenSSL 3 default in Node 17+; run in legacy-provider mode instead
      # of pinning an EOL Node version.
      NODE_OPTIONS: "--openssl-legacy-provider"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn run lint

      - name: Build vendor bundles + extension
        run: yarn run vscode:prepublish

      - name: Package .vsix
        run: npx @vscode/vsce package --no-yarn

      - name: Upload .vsix as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrastate-vsix
          path: "*.vsix"

      - name: Attach .vsix to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
